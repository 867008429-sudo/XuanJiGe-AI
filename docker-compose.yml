services:
  xuanjige:
    build: .
    container_name: xuanjige
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
      - backup-data:/app/backups
      - log-data:/app/logs
      - ./app.py:/app/app.py
      - ./bazi_engine.py:/app/bazi_engine.py
      - ./ai_service.py:/app/ai_service.py
      - ./db.py:/app/db.py
      - ./chat_tools.py:/app/chat_tools.py
      - ./chat_graph.py:/app/chat_graph.py
      - ./classics_search.py:/app/classics_search.py
      - ./chat_audit.py:/app/chat_audit.py
      - ./chat_cleanup.py:/app/chat_cleanup.py
      - ./data/classics:/app/data/classics:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  backup-data:
  log-data:
